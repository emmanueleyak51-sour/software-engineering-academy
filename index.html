38f,#58c3d1);transition:width .9s cubic-bezier(.2,.75,.25,1);box-shadow:0 0 13px #ee438f75}.xp-meter-meta{display:flex;justify-content:space-between;gap:9px;margin:8px 0 20px;color:#e0e2f2;font-size:12px}.xp-goal-title{display:flex;justify-content:space-between;align-items:center;margin:2px 0 9px;color:#a9a8d1;font-weight:700}.xp-goal-title span{color:#d8d7e8;font-size:11px}.xp-meter.goal{height:12px}.xp-meter.goal>span{background:linear-gradient(90deg,#7c61ef,#ee4f9e)}.xp-panel-foot{display:flex;align-items:center;gap:8px;margin-top:18px;color:#ff5c9b;font-size:11px;font-weight:700}.xp-live-dot{width:7px;height:7px;border-radius:50%;background:#ff5c9b;box-shadow:0 0 9px #ff5c9b;animation:softPulse 1.8s infinite}.avatar{position:relative;isolation:isolate;transition:transform .25s,box-shadow .25s}.avatar:before{content:'';position:absolute;inset:-4px;z-index:-1;border:1px solid #79dfc16b;border-radius:50%;animation:avatarOrbit 4s ease-in-out infinite}.avatar:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 0 20px #65d3b438}.top-avatar{border:0;width:40px;height:40px;font-size:12px;cursor:pointer}.profile .avatar{animation:avatarBreathe 3.6s ease-in-out infinite}.top-avatar:after{content:'';position:absolute;inset:-7px;border:1px solid #85e7c128;border-radius:50%;transform:scale(.85);animation:avatarHalo 3.6s ease-out infinite;pointer-events:none}@keyframes flameDance{0%,100%{transform:rotate(-5deg) scale(1)}35%{transform:rotate(4deg) scale(1.1)}65%{transform:rotate(-2deg) scale(.97)}}@keyframes flamePop{50%{transform:translateY(-4px) scale(1.35)}}@keyframes avatarOrbit{0%,100%{transform:scale(.97);opacity:.45}50%{transform:scale(1.06);opacity:.9}}@keyframes avatarBreathe{0%,100%{box-shadow:0 0 0 0 #68d5af00}50%{box-shadow:0 0 0 5px #68d5af13}}@keyframes avatarHalo{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.32);opacity:0}}@keyframes xpPanelEnter{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@media(max-width:760px){.top-actions{gap:6px}.top-actions .pill.streak-pill:first-child{display:inline-flex;padding:6px 9px;font-size:10px}.top-actions .streak-pill{font-size:0;gap:4px}.top-actions .streak-flame{font-size:14px}.top-actions .streak-pill #streak{font-size:11px}.top-actions .xp-pill{padding:6px 9px;font-size:10px}.xp-panel{right:0;top:calc(100% + 4px);padding:18px}.top-avatar{width:34px;height:34px}}@media(prefers-reduced-motion:reduce){.streak-flame,.avatar:before,.avatar:after,.profile .avatar,.xp-live-dot{animation:none}.xp-panel,.xp-meter>span{animation:none;transition:none}}

<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">⌘</span><span>Academy<small>NIGERIAN COMPUTING</small></span></div><div class="nav-label">Workspace</div><nav class="nav" id="nav" aria-label="Main navigation" tabindex="0"></nav><div class="side-foot"><div class="profile"><div class="avatar" id="profile-initials">EE</div><div><b id="profile-name" style="font-size:12px">Learner</b><small id="profile-level">Level 1 · Beginner</small></div></div></div></aside><main class="main"><header class="topbar"><div class="crumb" id="crumb">Workspace / Dashboard</div><div class="top-actions"><span class="pill streak-pill"><span class="streak-flame" aria-hidden="true">🔥</span><span id="streak">0</span> consecutive days</span><button class="pill xp-pill" id="xp-trigger" type="button" onclick="toggleXpPanel()" aria-haspopup="dialog" aria-expanded="false"><span class="xp-bolt" aria-hidden="true">ϟ</span><span id="xp">0</span> XP <span class="xp-chevron">⌄</span></button><button class="avatar top-avatar" id="top-avatar" type="button" onclick="setView('Settings')" aria-label="Open learner profile settings">EE</button></div></header><div id="content" class="content" aria-live="polite"></div></main></div>
<script>
const navItems=[['Dashboard','⌂'],['Learn','▤'],['Practice','⌘'],['Assignments','▣'],['Exams','◷'],['Projects','◈'],['Notes','▧'],['Progress','⌁'],['Settings','⚙']];
let lessons=[{id:'intro',title:'What is JavaScript?',time:'5 min',objective:'Describe what JavaScript does and where it runs.',explain:'JavaScript is a programming language that lets us give instructions to a computer. On a website, it can respond to clicks, update what you see, and work with information.',analogy:'Think of a website as a house: HTML is its structure, CSS is its decoration, and JavaScript is the electricity that makes things happen.',code:'console.log("Hello, world!");',mistake:'JavaScript and Java are different programming languages, despite their similar names.'},{id:'variables',title:'Variables',time:'8 min',objective:'Understand what variables are and how to create and use them.',explain:'A variable is a named place used to store a value. Give the place a clear name, then use that name whenever you need the value.',analogy:'A variable is like a labeled box. The label is the variable name; what you put inside is its value.',code:'let age = 20;\nconst name = "Emmanuel";\n\nage = 25; // let can be reassigned\nconsole.log(name, age);',mistake:'Use let when a value needs to change. Use const when you will not reassign it. A const variable still may contain an object whose contents can change; for now, think of const as a fixed label.'},{id:'types',title:'Data Types',time:'7 min',objective:'Recognize common kinds of values: text, numbers, and true/false.',explain:'A data type describes what kind of information a value represents. JavaScript can work with text (strings), numbers, and true-or-false values (booleans).',analogy:'A toolbox has different compartments for different tools. Data types help your program know how to handle each value.',code:'const learner = "Emmanuel"; // string\nconst lessonsDone = 3; // number\nconst isLearning = true; // boolean',mistake:'Text needs quotation marks. The number 20 and the text "20" look similar but are different types.'},{id:'operators',title:'Operators',time:'6 min',objective:'Use operators to calculate and compare values.',explain:'Operators are symbols that perform actions with values. Arithmetic operators calculate; comparison operators ask a yes-or-no question.',analogy:'An operator is like a button on a calculator: + adds, * multiplies, and > checks which number is larger.',code:'const price = 100;\nconst quantity = 3;\nconst total = price * quantity;\nconsole.log(total); // 300',mistake:'Use === to compare values for equality. A single = assigns a value instead.'},{id:'conditions',title:'Conditions',time:'8 min',objective:'Use if and else to make a program choose what to do.',explain:'A condition lets your program choose a path. If a statement is true, one block runs; otherwise, another block can run.',analogy:'A traffic light is a condition: if it is green, go; otherwise, wait.',code:'const score = 82;\nif (score >= 50) {\n  console.log("You passed!");\n} else {\n  console.log("Keep practising.");\n}',mistake:'Put the condition inside parentheses and the instructions inside curly braces.'},{id:'loops',title:'Loops',time:'8 min',objective:'Repeat an instruction using a for loop.',explain:'A loop repeats instructions for you. A for loop is useful when you know how many times you want to repeat something.',analogy:'A loop is like doing three laps around a track: the same action repeats, and a counter keeps track of each lap.',code:'for (let lap = 1; lap <= 3; lap++) {\n  console.log("Lap", lap);\n}',mistake:'Check that your loop has a stopping condition. Without one, it may run forever.'},{id:'functions',title:'Functions',time:'10 min',objective:'Create a reusable function that accepts information and returns a result.',explain:'A function is a named set of instructions. You can run it whenever you need that task, and give it information to work with.',analogy:'A function is like a recipe: provide ingredients (inputs), follow steps, and get a finished result (output).',code:'function greet(name) {\n  return "Hello, " + name;\n}\n\nconsole.log(greet("Emmanuel"));',mistake:'Defining a function does not run it. Call it by writing its name followed by parentheses.'}];
const additionalLessons=[
{id:'plan-program',moduleIndex:1,title:'Turn a problem into steps',time:'7 min',objective:'Break a small problem into instructions before writing code.',explain:'Programs solve problems by taking information, following clear steps, and producing a result. Planning first helps you catch missing steps before they become confusing code.',analogy:'A recipe works because the steps are ordered. “Bake the cake” is too vague; “mix, pour, bake, cool” gives you a plan.',code:'// Add two study sessions\nconst morning = 25;\nconst evening = 15;\nconst totalMinutes = morning + evening;\nconsole.log(totalMinutes);',output:'40',steps:['Name the information: morning and evening minutes.','Choose the operation: add both values.','Store the result in totalMinutes.','Print the result so you can check it.'],practice:'Plan the steps for converting minutes into hours before writing the code.',checkQuestion:'Why is it helpful to plan steps before coding?',checkChoices:['It helps make the solution clear before implementation.','It makes the computer run without instructions.','It removes the need to test.'],checkAnswer:0,checkWhy:'A clear plan reduces guesswork and gives you something specific to test.'},
{id:'arrays',moduleIndex:2,title:'Arrays: keep a list of values',time:'8 min',objective:'Create an array and read a value from its position.',explain:'An array stores several related values in one ordered list. Each item has a position called an index. In JavaScript, the first index is 0.',analogy:'An array is like a row of labeled lockers. The first locker is number 0, the next is 1, and so on.',code:'const topics = ["variables", "arrays", "functions"];\nconsole.log(topics[0]);\nconsole.log(topics.length);',output:'variables\n3',steps:['Create the list inside square brackets.','Separate each item with a comma.','Use [0] to read the first item.','Use .length to count the items.'],practice:'Create a list called favoriteFoods with three strings, then print the first one.',checkQuestion:'What is the index of the first item in a JavaScript array?',checkChoices:['1','0','-1'],checkAnswer:1,checkWhy:'JavaScript arrays start counting positions at 0.'},
{id:'objects',moduleIndex:2,title:'Objects: describe one thing',time:'8 min',objective:'Use an object to group named details about one thing.',explain:'An object groups related information using property names and values. This makes data easier to understand than a list of unrelated values.',analogy:'An object is like a student record card with labeled spaces for name, course, and level.',code:'const learner = {\n  name: "Emmanuel",\n  level: 1,\n  learning: true\n};\nconsole.log(learner.name);',output:'Emmanuel',steps:['Open an object with curly braces.','Write each property as name: value.','Separate properties with commas.','Read a property with a dot and its name.'],practice:'Create a book object with title and pageCount properties.',checkQuestion:'How do you read the name property from learner?',checkChoices:['learner.name','learner[0]','name.learner'],checkAnswer:0,checkWhy:'Dot notation uses the object name, a dot, and the property name.'},
{id:'scope',moduleIndex:2,title:'Scope: where a name is available',time:'7 min',objective:'Explain where a variable can be used in a program.',explain:'Scope is the part of a program where a variable name can be accessed. A variable created inside a function usually belongs to that function.',analogy:'Scope is like a room: a note inside one room is available there, but another room cannot automatically see it.',code:'function showMessage() {\n  const message = "Keep practising";\n  console.log(message);\n}\nshowMessage();',output:'Keep practising',steps:['The function begins a new local area.','message is created inside that area.','The function can read message.','Outside the function, message is not available.'],practice:'Make a function with a const called greeting and print it inside the function.',checkQuestion:'Where can a variable declared inside a function normally be used?',checkChoices:['Anywhere in every file','Inside that function','Only in the browser address bar'],checkAnswer:1,checkWhy:'A local variable is available inside the function scope where it was created.'},
{id:'dom',moduleIndex:2,title:'The DOM: JavaScript meets a page',time:'9 min',objective:'Describe how JavaScript can find and update an HTML element.',explain:'The browser turns an HTML document into a structured set of elements called the Document Object Model, or DOM. JavaScript can select those elements and change their text or behavior.',analogy:'The DOM is a map of a building. JavaScript can use a room label to find the right place and update what is there.',code:'// HTML: <p id="message">Ready</p>\nconst message = document.querySelector("#message");\nmessage.textContent = "You are learning!";',output:'The page paragraph now says: You are learning!',steps:['The browser reads the HTML and builds the DOM.','querySelector finds the element with id message.','textContent changes the words shown on the page.'],practice:'Select an element with id status and change its text to "In progress".',checkQuestion:'What does document.querySelector("#message") find?',checkChoices:['An element with id="message"','Every image on the page','A database record'],checkAnswer:0,checkWhy:'The # selector finds an HTML element by its id.'},
{id:'events',moduleIndex:2,title:'Events: respond to a click',time:'8 min',objective:'Connect a user action to a JavaScript response.',explain:'An event is something that happens in the browser, such as a click or a key press. An event listener tells JavaScript which function to run when that happens.',analogy:'A doorbell listens for a button press and then rings. An event listener works the same way for a page.',code:'const button = document.querySelector("#start");\nbutton.addEventListener("click", () => {\n  console.log("Lesson started");\n});',output:'Clicking the button prints: Lesson started',steps:['Find the button in the DOM.','Listen for the click event.','Run the function only after the click.'],practice:'Plan what a reset button should do when a learner clicks it.',checkQuestion:'When does the event listener function run?',checkChoices:['As soon as the file is saved','When the listened-for event happens','Every second automatically'],checkAnswer:1,checkWhy:'The browser calls the listener when its event happens.'},
{id:'async',moduleIndex:2,title:'Asynchronous JavaScript: wait without freezing',time:'9 min',objective:'Explain why some JavaScript work finishes later.',explain:'Some tasks take time, such as loading information from a server. Asynchronous code lets the page stay responsive while that work is happening, then handles the result when it arrives.',analogy:'You place an order at a cafe and continue chatting instead of staring at the counter. You are notified when the order is ready.',code:'async function loadGreeting() {\n  const response = await fetch("/greeting");\n  const greeting = await response.text();\n  console.log(greeting);\n}',output:'The greeting appears after the response arrives.',steps:['async marks a function that can wait for a result.','fetch starts a request.','await pauses this function while the response is prepared.','The rest of the page can remain responsive.'],practice:'In plain language, describe what your page should show while data is loading.',checkQuestion:'What does await do inside an async function?',checkChoices:['Waits for a result before continuing that function','Closes the browser','Repeats the previous line forever'],checkAnswer:0,checkWhy:'await waits for a promise to settle while other browser work can continue.'},
{id:'debugging',moduleIndex:2,title:'Debugging: find the cause',time:'8 min',objective:'Use a repeatable process to investigate a coding problem.',explain:'Debugging means finding and fixing the cause of unexpected behavior. Read the message, reproduce the problem, inspect the relevant values, and change one thing at a time.',analogy:'If a lamp does not turn on, check the plug, switch, and bulb one at a time instead of replacing everything.',code:'const score = 42;\nconsole.log("score:", score);\n// Compare the output with what you expected.',output:'score: 42',steps:['Describe what you expected.','Reproduce the behavior.','Read the error and inspect nearby values.','Make one change, then run it again.'],practice:'Write the first two checks you would make if a button did nothing.',checkQuestion:'Why change one thing at a time while debugging?',checkChoices:['So you can tell which change affected the result','To make the code longer','Because testing is not useful'],checkAnswer:0,checkWhy:'A small, controlled change helps identify the cause.'},
{id:'html-structure',moduleIndex:3,title:'HTML: give content meaning',time:'8 min',objective:'Build a simple page structure using meaningful HTML elements.',explain:'HTML describes the content and structure of a web page. Headings, paragraphs, lists, and links tell the browser and assistive technology what each part means.',analogy:'HTML is the frame and room labels of a house. It gives the page a structure people can understand.',code:'<main>\n  <h1>My learning journal</h1>\n  <p>Today I learned about variables.</p>\n  <a href="/lessons">Browse lessons</a>\n</main>',output:'A page with one main heading, a paragraph, and a link.',steps:['Use one main region for the central content.','Use a heading that describes the page.','Use paragraph elements for sentences.','Use a link when the user should navigate.'],practice:'Sketch a page with a title, a short introduction, and a link to your project.',checkQuestion:'Why use a heading element instead of making text merely large?',checkChoices:['It communicates the content structure','It automatically stores data','It makes JavaScript run faster'],checkAnswer:0,checkWhy:'Semantic headings expose the page outline to people and tools.'},
{id:'css-layout',moduleIndex:3,title:'CSS: make a clear visual layout',time:'8 min',objective:'Use CSS to set readable color, spacing, and layout.',explain:'CSS controls how HTML content looks. Rules select elements and apply properties such as color, spacing, size, and layout.',analogy:'If HTML is a house frame, CSS is the paint, spacing, and furniture arrangement.',code:'body {\n  font-family: system-ui, sans-serif;\n  line-height: 1.6;\n  max-width: 70ch;\n  margin: 2rem auto;\n}',output:'Readable text in a centered column.',steps:['Choose the elements to style.','Set comfortable type and line spacing.','Limit line width so paragraphs are easier to read.','Check contrast between text and background.'],practice:'Choose two CSS properties that would make a long reading page more comfortable.',checkQuestion:'Which language controls the visual presentation of a web page?',checkChoices:['CSS','SQL','Git'],checkAnswer:0,checkWhy:'CSS applies presentation and layout rules to HTML content.'},
{id:'responsive',moduleIndex:3,title:'Responsive design: fit different screens',time:'8 min',objective:'Explain how a layout can adapt to mobile and desktop screens.',explain:'Responsive design lets a page rearrange and resize for different screen widths. Flexible layouts and media queries help content remain usable on a phone, tablet, or desktop.',analogy:'A flexible backpack adjusts to what you carry while keeping everything accessible.',code:'.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }\n@media (max-width: 600px) {\n  .cards { grid-template-columns: 1fr; }\n}',output:'Two columns on wide screens; one column on narrow screens.',steps:['Start with content that fits a small screen.','Use flexible widths instead of fixed page widths.','Add a breakpoint when the layout needs to change.','Test with touch-sized controls.'],practice:'Describe how a two-column course page should change on a phone.',checkQuestion:'What is a media query commonly used for?',checkChoices:['Applying styles when screen conditions match','Saving a lesson to a database','Creating a JavaScript variable'],checkAnswer:0,checkWhy:'Media queries let CSS adapt to screen width and other device conditions.'},
{id:'accessibility',moduleIndex:3,title:'Accessibility: make the web usable by more people',time:'9 min',objective:'Identify practical ways to make a page accessible.',explain:'Accessibility means designing so people with different abilities can use the product. Clear labels, keyboard support, semantic HTML, readable contrast, and reduced motion all help.',analogy:'A ramp and clear signs make a building easier to navigate for many people. Accessible web features serve the same purpose.',code:'<label for="email">Email address</label>\n<input id="email" type="email" autocomplete="email">\n<button type="submit">Save note</button>',output:'A labeled input and a clearly named button.',steps:['Use meaningful HTML elements.','Give every input a programmatic label.','Make controls usable by keyboard.','Respect reduced-motion preferences.'],practice:'Find one button or input in a project and check whether its purpose is clear without seeing its styling.',checkQuestion:'Which is a useful accessibility practice?',checkChoices:['Provide a label for every form field','Use color as the only status signal','Remove keyboard focus outlines'],checkAnswer:0,checkWhy:'Labels help people understand and operate form controls.'},
{id:'git-basics',moduleIndex:4,title:'Git: save meaningful project history',time:'8 min',objective:'Explain how Git records changes to a project.',explain:'Git is a version control system. It records snapshots of your work so you can understand changes, compare versions, and collaborate safely.',analogy:'Git is like a sequence of labeled save points in a game. You can inspect how the project changed and return to an earlier point.',code:'git status\ngit add index.html\ngit commit -m "Add lesson page"',output:'Git records a named snapshot of the staged change.',steps:['Check which files changed.','Stage the changes you want to record.','Commit them with a clear message.','Review the project history when needed.'],practice:'Write a short commit message for adding a quiz feedback panel.',checkQuestion:'What does a Git commit represent?',checkChoices:['A recorded snapshot of staged project changes','A website visitor','A database query'],checkAnswer:0,checkWhy:'A commit stores a point in the project history.'},
{id:'big-o',moduleIndex:5,title:'Big O: compare how work grows',time:'9 min',objective:'Describe why an algorithm may take longer as its input grows.',explain:'Big O notation describes how an algorithm’s work grows as its input gets larger. It helps compare broad growth patterns, not exact running time on one computer.',analogy:'Checking every name in a longer list takes more steps as the list grows. Growth rate tells you how that work scales.',code:'// One pass through n items: O(n)\nfor (const item of items) {\n  console.log(item);\n}',output:'The loop visits each item once.',steps:['Name the input size as n.','Count how many times the key work repeats.','One pass over n items grows linearly: O(n).','Use this to compare approaches, then measure real performance.'],practice:'Compare checking one item by index with searching through a list one item at a time.',checkQuestion:'What does O(n) usually describe?',checkChoices:['Work that grows roughly with the number of items','A fixed amount of work for every input size','A specific programming language'],checkAnswer:0,checkWhy:'Linear growth means doubling the items roughly doubles the amount of work.'},
{id:'oop',moduleIndex:6,title:'Classes: create objects with a shared shape',time:'8 min',objective:'Describe how a class can define the shape and behavior of objects.',explain:'A class is a reusable description for creating objects. Objects made from the class can hold their own values while sharing the same set of methods.',analogy:'A class is a cookie cutter; each cookie has the same shape but can have its own decoration.',code:'class Course {\n  constructor(title) { this.title = title; }\n  describe() { return `Course: ${this.title}`; }\n}\nconst intro = new Course("JavaScript");',output:'intro.describe() returns "Course: JavaScript".',steps:['Define a class with the class keyword.','Use a constructor to set starting values.','Add a method for behavior.','Create an instance with new.'],practice:'Plan a Student class with name and course properties.',checkQuestion:'What does a class provide?',checkChoices:['A reusable description for creating objects','A place to store a whole website','A network connection'],checkAnswer:0,checkWhy:'A class describes the properties and behavior of its instances.'},
{id:'sql',moduleIndex:7,title:'SQL: ask a database for information',time:'9 min',objective:'Read a simple SELECT query and identify its result.',explain:'SQL is a language for working with relational databases. A SELECT query asks for chosen columns from a table, and WHERE can narrow which rows are returned.',analogy:'A database query is like asking a librarian for books matching a particular subject and date.',code:'SELECT name, grade\nFROM students\nWHERE grade >= 70;',output:'Names and grades for students with a grade of at least 70.',steps:['SELECT names the columns to return.','FROM names the table.','WHERE filters the rows.','Run a small query and inspect the result.'],practice:'Write in plain language a query that finds lessons lasting under ten minutes.',checkQuestion:'What does WHERE do in a SELECT query?',checkChoices:['Filters which rows are returned','Creates a new programming language','Changes the table title'],checkAnswer:0,checkWhy:'WHERE keeps rows that match a condition.'},
{id:'api-rest',moduleIndex:8,title:'APIs: let software communicate',time:'9 min',objective:'Explain what an API does and recognize a basic web request.',explain:'An API defines a way for one piece of software to request information or actions from another. A web API often uses HTTP methods such as GET to retrieve data.',analogy:'An API is like a service counter: you make a clear request, and the service returns a response.',code:'fetch("/api/lessons")\n  .then(response => response.json())\n  .then(lessons => console.log(lessons));',output:'The response is converted from JSON and shown in the console.',steps:['Choose the API address.','Send a request with the appropriate method.','Check whether the response succeeded.','Read the response data and handle errors.'],practice:'Describe what information a study-planner API might return for today.',checkQuestion:'What is the role of an API?',checkChoices:['Define how software can request information or actions','Style a heading','Store a keyboard shortcut'],checkAnswer:0,checkWhy:'An API is an agreed interface for communication between software.'},
{id:'testing',moduleIndex:12,title:'Testing: check behavior on purpose',time:'8 min',objective:'Explain how a test checks expected behavior.',explain:'A test runs a piece of software with chosen inputs and checks whether the result matches what should happen. Tests help catch mistakes as a project changes.',analogy:'A checklist before a flight checks important conditions before the journey continues.',code:'function add(a, b) { return a + b; }\nconsole.assert(add(2, 3) === 5, "adds two numbers");',output:'No assertion message means the expected result matched.',steps:['Choose a behavior that matters.','Provide a clear input.','State the expected result.','Run the test after changes.'],practice:'Write one expected input and output for a function that doubles a number.',checkQuestion:'What does a passing test tell you?',checkChoices:['The tested behavior matched its expected result','The entire application has no bugs','The code needs no maintenance'],checkAnswer:0,checkWhy:'A passing test gives evidence about the behavior it checks, not proof that all bugs are gone.'},
{id:'security-basics',moduleIndex:19,title:'Security basics: reduce avoidable risks',time:'9 min',objective:'Recognize basic habits that make software safer.',explain:'Secure software validates input, limits access, protects secrets, and handles failures carefully. Security is part of design and implementation, not a final decoration.',analogy:'A house uses locks, visitor rules, and protected keys. Software also needs layers that limit unwanted access.',code:'// Never trust input without checking it\nconst displayName = String(userInput).slice(0, 60);\n// Keep secret keys on a protected server.',output:'Input is limited before display; a secret is not embedded in client code.',steps:['Identify what data needs protection.','Validate untrusted input.','Give each user only necessary access.','Keep secrets out of browser code and source control.'],practice:'Name one piece of user data in a student app that should not be publicly visible.',checkQuestion:'Where should a private server API key be kept?',checkChoices:['In protected server configuration','In a public HTML file','In a button label'],checkAnswer:0,checkWhy:'Frontend code can be inspected by users, so secrets belong in protected server-side configuration.'},
{id:'architecture',moduleIndex:13,title:'Architecture: choose clear system boundaries',time:'9 min',objective:'Explain why software is divided into components.',explain:'Software architecture describes the major parts of a system and how they work together. Clear boundaries help people change one part without unexpectedly breaking everything else.',analogy:'A campus has separate buildings for different activities, connected by paths. Each building has a purpose and agreed ways to connect.',code:'Browser UI  →  API service  →  Database\n       input       rules         stored records',output:'Each part has a clear responsibility and communicates through an interface.',steps:['Name the users and important system goals.','Identify the main responsibilities.','Choose how the parts communicate.','Consider reliability, security, and future change.'],practice:'For the Academy, list one responsibility for the interface and one for stored learning progress.',checkQuestion:'Why define component boundaries?',checkChoices:['To make responsibilities clearer and changes safer','To guarantee no testing is needed','To make every component depend on every other one'],checkAnswer:0,checkWhy:'Clear responsibilities reduce accidental coupling and make maintenance easier.'},
{id:'cloud-deploy',moduleIndex:20,title:'Deployment: make a project available',time:'8 min',objective:'Describe the basic steps between finished code and a running website.',explain:'Deployment makes a tested version of software available in an environment people can use. Teams build, check, configure, and release changes carefully.',analogy:'A school play moves from rehearsal to opening night through a planned checklist, not by skipping straight to the stage.',code:'Change → review → build → test → deploy → observe',output:'A repeatable release path with checks and monitoring.',steps:['Save and review the change.','Build the release artifact.','Run automated checks.','Deploy and watch for problems.'],practice:'Name one check you would run before publishing a student portal update.',checkQuestion:'Why observe a system after deployment?',checkChoices:['To notice errors and performance issues in real use','To make the code private','To avoid documenting the release'],checkAnswer:0,checkWhy:'Monitoring helps teams detect and respond to problems after a release.'},
{id:'capstone-planning',moduleIndex:27,title:'Capstone planning: define a useful problem',time:'10 min',objective:'Turn a project idea into a focused capstone problem statement.',explain:'A capstone brings together skills from the program to solve a defined problem. Start with who experiences the problem, what they need, and how you will know the project helped.',analogy:'Before drawing a map, decide who is travelling and where they need to go. A project needs the same clarity of destination.',code:'Problem: learners lose track of practice\nUser: beginner software engineering student\nOutcome: clear next study action\nEvidence: task completion and learner feedback',output:'A focused starting point for requirements and evaluation.',steps:['Describe the real user and their context.','State the problem without choosing a solution too early.','Define a measurable outcome.','Plan how you will gather feedback and evaluate the result.'],practice:'Write a one-sentence problem statement for an app that helps students revise weak topics.',checkQuestion:'What should a capstone problem statement focus on first?',checkChoices:['The user problem and desired outcome','The color palette','The programming framework'],checkAnswer:0,checkWhy:'A well-defined problem guides later requirements and technology choices.'}
];
additionalLessons.push(
{id:'concurrency',moduleIndex:11,title:'Concurrency: coordinate work safely',time:'9 min',objective:'Explain why shared data needs careful coordination when tasks run together.',explain:'Concurrency lets a program make progress on more than one task during the same period. When tasks touch the same shared value, their timing can create unexpected results, so systems use coordination tools.',analogy:'Two people updating the same whiteboard need a clear turn-taking rule, or one update may erase the other.',code:'let seats = 1;\n// Two requests both check the same seat\n// A real service must reserve it atomically.',output:'Only one request should successfully reserve the final seat.',steps:['Identify tasks that can overlap.','Find the data those tasks share.','Protect updates with a safe coordination strategy.','Test interleavings and failure cases.'],practice:'Describe a race condition that could happen if two students reserve the final lab computer.',checkQuestion:'What is a race condition?',checkChoices:['A result that depends on the timing of overlapping work','A kind of database table','A page animation'],checkAnswer:0,checkWhy:'When operations overlap, timing can change which result occurs.'},
{id:'continuous-delivery',moduleIndex:21,title:'Continuous delivery: release small changes safely',time:'9 min',objective:'Outline a simple automated path from code change to deployment.',explain:'Continuous delivery automates build and test steps so a team can release a checked change reliably. Small changes are easier to review and recover from than one huge release.',analogy:'A quality line checks each package before it leaves the factory, instead of inspecting everything at the end.',code:'commit → build → test → review → deploy\n✓ tests passed\n✓ release ready',output:'A change moves forward only after its checks succeed.',steps:['A commit starts the workflow.','The project builds in a clean environment.','Automated tests check expected behavior.','A reviewed release can be deployed and observed.'],practice:'Choose one automated check you would require before merging an Academy change.',checkQuestion:'Why release small changes with automated checks?',checkChoices:['They are easier to review and diagnose','They never need monitoring','They prevent all future bugs'],checkAnswer:0,checkWhy:'Smaller releases narrow down what changed and make problems easier to investigate.'},
{id:'distributed-systems',moduleIndex:22,title:'Distributed systems: expect parts to fail',time:'10 min',objective:'Describe a basic reliability challenge in a multi-service system.',explain:'A distributed system has software running across multiple computers that communicate over a network. Messages can be delayed or lost, and one service may fail while others keep running.',analogy:'A group project depends on messages between teammates. A missed message does not mean every teammate has stopped working.',code:'Client → Service A → Service B\n       request may be delayed\n       retry needs a safe limit',output:'The design accounts for slow responses and partial failures.',steps:['List which components communicate.','Assume messages can be delayed.','Set timeouts and safe retry rules.','Make failure visible and recoverable.'],practice:'What should the Academy show if a future lesson service is temporarily unavailable?',checkQuestion:'What does partial failure mean?',checkChoices:['One part fails while other parts may keep running','Every computer is always offline','A test passed halfway'],checkAnswer:0,checkWhy:'Distributed components can fail independently while the rest of the system remains active.'},
{id:'mobile-design',moduleIndex:23,title:'Mobile design: respect touch and context',time:'8 min',objective:'Choose mobile interaction patterns that work well on small touch screens.',explain:'Mobile software runs in a context with a small screen, touch input, changing network quality, and limited attention. Good design keeps important actions clear and works with assistive technologies.',analogy:'A pocket notebook is designed for quick use in many places. A phone interface needs the same focus and portability.',code:'button {\n  min-height: 44px;\n  padding: 0.75rem 1rem;\n}\n@media (max-width: 600px) {\n  .lesson-grid { grid-template-columns: 1fr; }\n}',output:'Touch-friendly controls and a single-column lesson layout on narrow screens.',steps:['Prioritize the learner’s main task.','Use controls with a comfortable touch target.','Keep content readable without sideways scrolling.','Check keyboard and screen-reader access too.'],practice:'Review a page and identify one control that may be too small to tap.',checkQuestion:'What is a useful mobile design choice?',checkChoices:['Large touch targets and a clear main task','Hover-only controls','Fixed wide tables'],checkAnswer:0,checkWhy:'Touch-friendly controls and focused layouts are easier to use on small screens.'},
{id:'data-ai',moduleIndex:24,title:'Evaluate an AI feature responsibly',time:'9 min',objective:'Name simple checks before adding an AI-generated suggestion to a product.',explain:'AI features can produce helpful suggestions, but their output can be incomplete or wrong. Evaluate them against a clear task, representative examples, privacy requirements, and a human review path.',analogy:'A calculator is useful, but you still check whether you entered the right numbers and whether the result makes sense.',code:'input → model suggestion → validation → human review\n# do not expose private learner data',output:'The suggestion is checked before it affects a learner.',steps:['Define what useful output means.','Try normal, unusual, and adversarial examples.','Measure errors and inspect who is affected.','Protect personal data and allow correction.'],practice:'List two test cases for an AI tutor that explains a programming error.',checkQuestion:'What should happen before an AI suggestion changes a learner’s record?',checkChoices:['Validate it and provide an appropriate review step','Trust it automatically','Hide how it was produced'],checkAnswer:0,checkWhy:'AI output needs checks and appropriate human oversight before consequential changes.'},
{id:'architecture-patterns',moduleIndex:25,title:'Architecture decisions: record the why',time:'9 min',objective:'Write a short architecture decision with context, choice, and tradeoffs.',explain:'An architecture decision record captures an important choice and why a team made it. It helps future contributors understand the context and revisit the choice if conditions change.',analogy:'A trail sign explains why a path crosses a bridge. The reason helps later travellers decide whether the route still makes sense.',code:'Decision: keep lesson content in structured objects\nContext: many lessons share a layout\nTradeoff: content schema needs clear ownership',output:'A future contributor can understand the choice and its cost.',steps:['State the context and constraint.','Describe the chosen option.','Record benefits and drawbacks.','Note when the decision should be reviewed.'],practice:'Write a one-sentence reason for storing lesson content separately from page layout.',checkQuestion:'What is the main value of recording an architecture decision?',checkChoices:['Preserving the reasoning and tradeoffs','Guaranteeing the choice never changes','Replacing all technical documentation'],checkAnswer:0,checkWhy:'The record preserves context so teams can maintain or revisit the decision intelligently.'},
{id:'research-methods',moduleIndex:26,title:'Research: ask a question you can answer',time:'9 min',objective:'Turn a broad software topic into a focused research question.',explain:'Research starts with a question that is specific enough to investigate. You gather trustworthy evidence, choose a suitable method, and explain what the evidence can and cannot tell you.',analogy:'A magnifying glass helps when you decide which small part of a scene to examine.',code:'Broad: Are mobile apps useful?\nFocused: Does a 5-minute practice reminder\nimprove weekly lesson completion for beginners?',output:'A focused question identifies a measure, audience, and context.',steps:['Narrow the topic to one user problem.','Choose an outcome you can observe.','Define who and where you will study.','Select evidence and methods that fit the question.'],practice:'Rewrite “Does gamification work?” as a question with a learner group and measurable outcome.',checkQuestion:'Which is a stronger research question?',checkChoices:['Does a weekly review quiz improve recall for first-year programming students?','Is software interesting?','Should every app use AI?'],checkAnswer:0,checkWhy:'A focused question names a group and an outcome that can be investigated.'},
{id:'capstone-evaluation',moduleIndex:28,title:'Capstone evaluation: test the outcome',time:'10 min',objective:'Plan a small evaluation that checks whether a project meets its goals.',explain:'A final project should be assessed against its requirements and its users’ needs. Evaluation can combine functional tests, usability feedback, accessibility checks, and a clear discussion of limitations.',analogy:'A bridge is evaluated against the job it must do, its safety requirements, and how it performs in real conditions.',code:'Goal: learners find a useful next lesson\nMeasure: task success + time + feedback\nReview: keyboard access + error states',output:'The evaluation plan connects project goals to observable evidence.',steps:['Return to the problem statement.','Choose measures that reflect the goal.','Test with realistic tasks and users.','Report results, limitations, and next improvements.'],practice:'Choose one user task and two measures for your Academy capstone evaluation.',checkQuestion:'Why should evaluation measures match the project goal?',checkChoices:['They show whether the software addressed its intended problem','They make the presentation longer','They avoid collecting any evidence'],checkAnswer:0,checkWhy:'Measures are useful when they tell you whether the intended outcome happened.'},
{id:'industry-review',moduleIndex:29,title:'Code review: make feedback useful',time:'8 min',objective:'Give a respectful code review comment that points to a concrete improvement.',explain:'A code review checks a change for correctness, clarity, risk, and maintainability. Useful feedback is specific, kind, and focused on the code rather than the person.',analogy:'A teammate checks a map before the trip and points to the confusing turn so the route is clearer for everyone.',code:'Instead of: "This is bad."\nTry: "Could we handle an empty list here?\nThe average currently divides by zero."',output:'Specific feedback names a condition and explains its impact.',steps:['Understand the goal of the change.','Look for correctness and edge cases.','Explain concerns with a concrete example.','Acknowledge what is clear and helpful.'],practice:'Rewrite “This function is confusing” as one specific, constructive review comment.',checkQuestion:'What makes code review feedback constructive?',checkChoices:['It is specific, respectful, and explains the concern','It criticizes the author','It only says whether you like the style'],checkAnswer:0,checkWhy:'Concrete, respectful feedback helps the author decide what to improve.'},
{id:'ethics-privacy',moduleIndex:30,title:'Ethics and privacy: collect only what is needed',time:'9 min',objective:'Identify a privacy-conscious choice in a student application.',explain:'Ethical software engineering considers who may be affected by a product. Collect only necessary data, explain its use, protect it, and give learners meaningful control.',analogy:'A library asks for the details it needs to lend a book, not every detail about your life.',code:'// Keep only what the learning feature needs\nconst progressRecord = {\n  lessonId: "arrays",\n  completed: true\n};',output:'The record stores learning progress without unrelated personal details.',steps:['Identify whose data is involved.','Ask whether each field is necessary.','Explain how the data is used.','Protect access and define when to remove it.'],practice:'For a lesson progress tracker, name one data field you need and one you can avoid collecting.',checkQuestion:'What is data minimization?',checkChoices:['Collect only the data needed for a clear purpose','Save every possible detail forever','Share private data by default'],checkAnswer:0,checkWhy:'Minimizing collection reduces privacy risk and makes the purpose clearer.'},
{id:'portfolio',moduleIndex:31,title:'Portfolio: show how you think',time:'8 min',objective:'Describe a project clearly using the problem, your decisions, and the result.',explain:'A portfolio is a curated set of work that shows what you can build and how you approach problems. A good project page explains the user need, design choices, tests, and what you learned.',analogy:'An engineer’s portfolio is a guided tour of selected work, not a box of every draft they ever made.',code:'Project story\n1. Problem and intended user\n2. Important design decision\n3. What you built and tested\n4. What you would improve next',output:'A reviewer can understand the project and your contribution.',steps:['Choose work that demonstrates a skill.','Explain the problem and who it helps.','Show the result and evidence from testing.','Reflect on a decision and a next improvement.'],practice:'Write a two-sentence introduction for your personal profile page project.',checkQuestion:'What helps a portfolio project tell a strong story?',checkChoices:['Problem, decisions, evidence, and reflection','Only a screenshot','A long list of technologies without context'],checkAnswer:0,checkWhy:'The story shows how you reason and learn, not just which tools you used.'},
{id:'elective-plan',moduleIndex:32,title:'Choose a specialization with a learning plan',time:'8 min',objective:'Compare areas of software engineering and plan a first exploration.',explain:'Electives let you explore areas such as data engineering, security, mobile, or cloud systems. Choose based on problems that interest you, then try a small project before committing to a direction.',analogy:'Choosing a trail is easier after taking a short walk on it and checking whether the terrain interests you.',code:'Interest → small experiment → reflection\nExample: build a tiny data dashboard\nThen decide what you want to learn next.',output:'A short experiment helps you make an informed learning choice.',steps:['List problems or users you care about.','Pick one specialization to explore.','Build a small, time-boxed experiment.','Reflect on what you enjoyed and what challenged you.'],practice:'Choose one area—security, mobile, data, or cloud—and write a tiny project you could try.',checkQuestion:'What is a useful first step toward a specialization?',checkChoices:['Try a small project and reflect on the experience','Choose based only on a job title','Skip the fundamentals'],checkAnswer:0,checkWhy:'A small project gives you evidence about whether the work interests you.'}
);

{id:'software-methods',moduleIndex:9,title:'Software methods: deliver in small steps',time:'9 min',objective:'Explain how iterative work helps teams learn and reduce risk.',explain:'Teams split a large goal into small pieces, build and test one slice, then review what to improve. Plans can change when evidence or user needs change.',analogy:'A long journey is easier to adjust when you check the map at each stop.',code:'Plan a small task → build → test → review. Keep what worked and choose one improvement.',output:'Frequent review gives a team evidence to guide its next step.',steps:['Choose one small outcome.','Agree how to know it is done.','Build and test the smallest useful change.','Review feedback and choose the next slice.'],practice:'Break a student study planner into three small releases, each with a useful outcome.',checkQuestion:'Why work in small, reviewed increments?',checkChoices:['The team can learn from feedback and catch problems earlier','A plan can never change','Testing becomes unnecessary'],checkAnswer:0,checkWhy:'Frequent review gives the team evidence to guide the next step.'},
{id:'computer-networks',moduleIndex:10,title:'Computer networks: follow a web request',time:'9 min',objective:'Trace how a browser reaches a server and receives a response.',explain:'A network carries information between devices. A browser looks up a server address, sends a request using HTTPS, then interprets the response.',analogy:'A web request is like an addressed letter: the destination matters, and the return journey carries the response.',code:'Browser → DNS lookup → server; Browser ← HTTPS response ← server. A timeout means the reply did not arrive in time.',output:'The browser and server exchange messages across a network.',steps:['Enter a website address.','Look up its server address.','Send a request over the network.','Receive and interpret the response.'],practice:'Name two reasons a browser might show a timeout even when your code is correct.',checkQuestion:'What does DNS help a browser find?',checkChoices:['The server address associated with a domain name','The page font size','A JavaScript variable'],checkAnswer:0,checkWhy:'DNS helps translate a domain name into an address used to reach a server.'},
{id:'professional-engineering',moduleIndex:14,title:'Professional engineering: make work dependable',time:'10 min',objective:'Use a clear workflow to make a change reviewable and safe to release.',explain:'Professional engineering combines readable code with version control, review, tests, documentation, and monitoring so people can understand changes and respond to problems.',analogy:'A checklist helps a trained team catch important details even when the work feels familiar.',code:'Describe change → small commit → checks and review → release and observe',output:'A change has a traceable path from idea to observed release.',steps:['State the user need and expected result.','Keep the change small and easy to inspect.','Run checks and request review.','Watch the release and record follow-up.'],practice:'Create a four-item release checklist for a change to learner progress tracking.',checkQuestion:'What makes a change easier to review?',checkChoices:['A focused change with a clear purpose and passing checks','A large change with no description','Skipping version history'],checkAnswer:0,checkWhy:'A reviewer can understand and verify a focused change more easily.'},
{id:'discrete-math',moduleIndex:15,title:'Discrete math: reason with sets and logic',time:'9 min',objective:'Use a logical condition to describe when a feature is available.',explain:'Discrete mathematics studies sets and logical statements. Programmers use this reasoning to describe rules precisely and find cases a program must handle.',analogy:'A set is a clearly labeled collection. Logic checks whether a rule is true.',code:'const hasAccount = true; const lessonIsOpen = true; const canStart = hasAccount && lessonIsOpen;',output:'The learner can start only when both conditions are true.',steps:['Name each condition.','Combine conditions with AND when both are required.','Check true and false combinations.','Turn the rule into clear code.'],practice:'Write a rule: a learner can submit only if the answer is saved and the deadline has not passed.',checkQuestion:'What does A && B mean?',checkChoices:['A and B must both be true','A or B must be true','A is changed into B'],checkAnswer:0,checkWhy:'AND is true only when both conditions are true.'},
{id:'algorithms-ii',moduleIndex:16,title:'Algorithms II: compare ways to search',time:'10 min',objective:'Choose a search strategy based on how data is organized.',explain:'Linear search checks items one at a time and works on any list. Binary search repeatedly halves a sorted list, which can be faster for large data.',analogy:'Find a name by checking every card in a pile, or jump through an alphabetized index to narrow the search.',code:'Unsorted list → linear search. Sorted list → binary search. Binary search requires sorted data.',output:'The data structure helps determine which search method fits.',steps:['Check whether the list is sorted.','Choose a suitable search method.','Compare checks as the list grows.','Include sorting cost in your decision.'],practice:'For 20 unsorted names, choose a search method and explain whether sorting first helps.',checkQuestion:'What requirement does binary search have?',checkChoices:['The data must be in sorted order','The data must contain only numbers','The list must have exactly ten items'],checkAnswer:0,checkWhy:'Binary search relies on order to know which half can be discarded.'},
{id:'ux-interface',moduleIndex:17,title:'User experience: design for the next action',time:'9 min',objective:'Make a screen’s main action clear and accessible.',explain:'User experience design considers what people are trying to do, what information they need, and where they may get stuck. A strong interface makes the next action clear and gives useful feedback.',analogy:'A well-marked path helps visitors know where to go without asking for directions.',code:'Lesson check → clear action → helpful feedback → keyboard and screen reader access',output:'The interface guides learners and explains what happened.',steps:['Name the user and their goal.','Make the main action easy to find.','Show clear feedback.','Check keyboard use, contrast, and labels.'],practice:'List what a learner should see before, during, and after submitting an answer.',checkQuestion:'What should useful feedback do?',checkChoices:['Explain the result and the next step','Leave the user guessing','Appear only after the page is closed'],checkAnswer:0,checkWhy:'Feedback helps users understand what happened and how to continue.'},
{id:'requirements',moduleIndex:18,title:'Requirements: describe what success means',time:'9 min',objective:'Write an observable requirement a team can test.',explain:'Requirements describe what a system should do and the constraints it must meet. A useful requirement is clear enough to implement and verify.',analogy:'A project brief is a shared destination that helps a builder and reviewer agree what “arrived” means.',code:'Vague: The page should be fast. Clearer: The lesson opens in under 2 seconds on the supported test device.',output:'A measurable requirement can be discussed and checked.',steps:['Identify the user need.','Describe expected behavior.','Add a measurable condition.','Review it with users and teammates.'],practice:'Rewrite “make the progress page easy to use” as a specific, observable requirement.',checkQuestion:'What makes a requirement testable?',checkChoices:['It describes an observable result or condition','It uses more technical words','It avoids expected behavior'],checkAnswer:0,checkWhy:'A testable requirement gives the team something observable to check.'}
);
additionalLessons.push(
{id:'code-review',moduleIndex:14,title:'Review a change like a teammate',time:'8 min',objective:'Review a small change for clarity, correctness, and risk.',explain:'A review checks whether a change solves the stated problem, handles important edge cases, and can be understood by the next engineer. Comments should point to a concrete place and suggest a useful next step.',analogy:'A second pair of eyes checks the bridge design before people cross it.',code:'Review: total = price * quantity\nQuestion: what happens when quantity is 0?\nSuggestion: add a test for the zero case.',output:'A focused review surfaces a real edge case with an actionable suggestion.',steps:['Read the goal and surrounding code.','Trace a normal case and an edge case.','Ask a question when intent is unclear.','Explain the impact and suggest a small change.'],practice:'Write a constructive review comment for code that divides a total by the number of students without handling an empty class.',checkQuestion:'What should a useful review comment include?',checkChoices:['A specific concern and its impact','A judgment about the author','A vague request to rewrite everything'],checkAnswer:0,checkWhy:'Specific comments help the author understand and address the issue.'},
{id:'release-readiness',moduleIndex:14,title:'Prepare a release handoff',time:'9 min',objective:'Create a concise release note that helps a teammate support a change.',explain:'A release handoff summarizes what changed, who benefits, what was checked, and how to spot a problem. It connects engineering work to the people who operate and use the software.',analogy:'A relay runner passes the baton with enough context for the next person to continue safely.',code:'Change: learners can export progress\nChecked: empty and large histories\nWatch: export failures in release logs\nRollback: disable the export action',output:'A teammate can understand the change and respond if it fails.',steps:['Describe the change in user terms.','List checks that were completed.','Name one risk or signal to monitor.','Document a safe rollback or mitigation.'],practice:'Draft a four-line handoff for a new lesson search feature.',checkQuestion:'Why include a rollback or mitigation note?',checkChoices:['It gives the team a response if the release causes a problem','It guarantees the release cannot fail','It replaces testing'],checkAnswer:0,checkWhy:'A known response can reduce confusion and recovery time.'},
{id:'architecture-decisions',moduleIndex:25,title:'Record an architecture decision',time:'9 min',objective:'Document a technical choice and the tradeoffs behind it.',explain:'Architecture decisions affect how a system can change later. A short decision record captures the context, options, chosen approach, and consequences so future teammates understand why it was selected.',analogy:'A trail marker explains which route was chosen and what terrain to expect ahead.',code:'Context: lessons must work offline\nOptions: browser storage / remote service\nDecision: browser storage for the first version\nTradeoff: local-only access and limited sharing',output:'The decision is understandable and its limitations are visible.',steps:['State the problem and constraints.','Compare realistic options.','Record the choice and reason.','Name consequences and conditions that could change the decision.'],practice:'Write a short decision record for choosing local storage versus a server database for learner progress.',checkQuestion:'What belongs in an architecture decision record?',checkChoices:['Context, options, decision, and consequences','Only the name of the framework','A list of code style rules'],checkAnswer:0,checkWhy:'These details help someone understand both the choice and its tradeoffs.'},
{id:'architecture-boundaries',moduleIndex:25,title:'Set boundaries between software components',time:'9 min',objective:'Separate responsibilities so components can change independently.',explain:'A component boundary groups related responsibilities behind a clear interface. Good boundaries reduce accidental coupling, make testing easier, and let a team change one part without rewriting unrelated parts.',analogy:'Rooms with doors let people use one space without walking through every other room.',code:'Lesson UI → Progress service → Storage\nThe UI requests: completeLesson(id)\nIt does not edit storage details directly.',output:'Each component has a focused job and a clear way to communicate.',steps:['List the responsibilities in the feature.','Group tasks that change for similar reasons.','Define what information crosses each boundary.','Test the interface without relying on internal details.'],practice:'Draw three components for a course enrollment feature and label the information each passes.',checkQuestion:'Why define a component interface?',checkChoices:['To limit coupling and make changes easier to test','To hide every error','To increase the number of files'],checkAnswer:0,checkWhy:'A clear interface lets other parts depend on behavior instead of implementation details.'},
{id:'research-question',moduleIndex:26,title:'Turn a broad idea into a research question',time:'9 min',objective:'Write a focused question that can be investigated with evidence.',explain:'A useful research question identifies a group, a situation, and an outcome you can observe. A focused question guides what you build, what you measure, and what you can honestly conclude.',analogy:'A camera gives a clearer picture after you choose where to focus.',code:'Broad: Does the Academy help students?\nFocused: Do guided examples help beginners\ncomplete their first array exercise?',output:'A focused question suggests a practical way to collect evidence.',steps:['Name the learner or context.','Describe the intervention or feature.','Choose an observable outcome.','Check that the question fits your time and access to evidence.'],practice:'Write one focused question about whether lesson hints help beginners debug JavaScript.',checkQuestion:'What makes a research question useful?',checkChoices:['It is focused and answerable with available evidence','It assumes the feature already worked','It covers every possible learner and outcome'],checkAnswer:0,checkWhy:'A focused, answerable question keeps the project and evaluation manageable.'},
{id:'technical-writing',moduleIndex:26,title:'Write a technical explanation with evidence',time:'8 min',objective:'Explain a result using a claim, evidence, and limitation.',explain:'Technical writing helps another person understand what you did and what your findings support. Separate observed evidence from interpretation, and name limitations so readers do not mistake a small result for a universal truth.',analogy:'A map legend explains what symbols mean and where the map stops being reliable.',code:'Claim: learners finished the task more often.\nEvidence: 8 of 10 pilot learners finished.\nLimit: small group; no comparison cohort.',output:'Readers can see what was observed and what remains uncertain.',steps:['State the question or claim.','Present the relevant evidence.','Explain how the evidence supports the claim.','Name the limits and next investigation.'],practice:'Write a three-sentence summary of a usability test with five learners, including one limitation.',checkQuestion:'Why state a study limitation?',checkChoices:['To show what the evidence cannot establish','To make the work sound unsuccessful','To avoid reporting the result'],checkAnswer:0,checkWhy:'A limitation helps readers interpret the result fairly.'},
{id:'api-contracts',moduleIndex:27,title:'Design a stable integration contract',time:'9 min',objective:'Specify the request and response that two systems exchange.',explain:'An integration contract names the data, behavior, errors, and version expectations at a boundary. Both sides can be developed and tested when the contract is clear.',analogy:'A shared form tells two offices exactly which information to send and where to put it.',code:'POST /enrollments\nRequest: { learnerId, courseId }\nSuccess: { enrollmentId, status }\nErrors: 400 invalid input · 404 not found',output:'The client and service agree on a predictable exchange.',steps:['Identify who sends and receives the message.','Define required fields and their types.','Describe success and error responses.','Plan how the contract can evolve safely.'],practice:'Define a small contract for a service that returns a learner’s completed lesson IDs.',checkQuestion:'What should an integration contract describe?',checkChoices:['Data, expected behavior, errors, and version expectations','Only the button color','The internal code of every connected service'],checkAnswer:0,checkWhy:'A clear contract helps connected components work together reliably.'},
{id:'idempotency-retries',moduleIndex:27,title:'Make retries safe with idempotency',time:'9 min',objective:'Explain how to prevent duplicate effects when a request is retried.',explain:'A network request may succeed on the server while its response gets lost. The client may retry without knowing what happened. An idempotency key lets the server recognize the same intended operation and avoid repeating its effect.',analogy:'A numbered receipt lets a cashier recognize that the same payment was already processed.',code:'POST /payments\nIdempotency-Key: order-8472\nRetry with the same key → return the original result',output:'A repeated request does not create a duplicate payment.',steps:['Identify operations with costly duplicate effects.','Give each intended operation a stable key.','Store the result associated with that key.','Return the original result for a safe retry.'],practice:'Describe how the Academy could avoid creating duplicate course enrollments when a learner double-clicks.',checkQuestion:'What problem does an idempotency key address?',checkChoices:['A retry accidentally performing the same action twice','A slow animation','An invalid CSS selector'],checkAnswer:0,checkWhy:'The key lets a service recognize repeated attempts for one intended operation.'},
{id:'capstone-requirements',moduleIndex:28,title:'Write capstone requirements and acceptance criteria',time:'10 min',objective:'Translate a user need into a small set of verifiable requirements.',explain:'A capstone begins with the needs of a real audience. Requirements describe the behavior the solution must provide, and acceptance criteria give the team a concrete way to check each requirement.',analogy:'A checklist for a custom-built room lets the builder and owner agree what “finished” means.',code:'Need: learners lose track of weak topics\nRequirement: show unfinished lessons by module\nAcceptance: selecting one opens that lesson',output:'The capstone has a shared target the team can review and test.',steps:['Interview or observe the intended users.','Record needs without jumping to a solution.','Write a small number of testable requirements.','Review the criteria with a user or supervisor.'],practice:'Write two acceptance criteria for a project that helps students organize assignments.',checkQuestion:'What is an acceptance criterion?',checkChoices:['A checkable condition that shows a requirement is met','A visual idea with no expected behavior','A promise that users will love the result'],checkAnswer:0,checkWhy:'Acceptance criteria let the team verify a requirement with observable behavior.'},
{id:'capstone-scope',moduleIndex:28,title:'Scope a capstone into milestones',time:'9 min',objective:'Choose a minimum useful version and order its milestones.',explain:'A capstone can grow beyond the time available. A minimum useful version solves one important user problem, while later milestones add value after the core path works.',analogy:'Build a sturdy bridge crossing first, then add signs and lighting once people can cross safely.',code:'Core: create a study plan\nNext: track completed sessions\nLater: suggest revisions from results',output:'Milestones protect the essential outcome from optional feature growth.',steps:['State the one user outcome that matters most.','List essential and optional capabilities separately.','Order work by dependency and risk.','Set a clear boundary for what will not fit.'],practice:'Divide a student support application into an essential first release and two optional later milestones.',checkQuestion:'What is the purpose of a minimum useful version?',checkChoices:['Prove the core user outcome with manageable scope','Include every idea at launch','Avoid talking to users'],checkAnswer:0,checkWhy:'A focused version tests the central idea before extra scope consumes time.'},
{id:'capstone-test-strategy',moduleIndex:29,title:'Build a capstone test strategy',time:'10 min',objective:'Match test types to the risks in your project.',explain:'A strong test strategy checks important rules at different levels. Unit tests isolate small logic, integration tests check connected parts, and end-to-end tests follow a user task through the system.',analogy:'Inspecting individual parts, the assembled machine, and a real operating cycle catches different kinds of faults.',code:'Unit: calculate study streak\nIntegration: save and reload progress\nEnd-to-end: learner completes a lesson',output:'Each test level checks a distinct risk in the capstone.',steps:['List the most important user journeys.','Identify risky rules and data boundaries.','Choose the smallest test level that can catch each issue.','Include accessibility and failure-state checks.'],practice:'Choose a unit, integration, and end-to-end test for a course enrollment feature.',checkQuestion:'Why use more than one test level?',checkChoices:['Different levels reveal different kinds of defects','One level is always too slow','More test files guarantee perfect software'],checkAnswer:0,checkWhy:'A mixture checks isolated rules as well as behavior across connected components.'},
{id:'capstone-evaluation-plan',moduleIndex:29,title:'Evaluate the capstone against its goal',time:'9 min',objective:'Measure whether the finished project helped its intended users.',explain:'Evaluation compares the project outcome with the original goal. Combine appropriate measures, user feedback, and realistic tasks, then report unexpected results and limitations.',analogy:'A coach checks whether a training plan improved the skill it was designed to build.',code:'Goal: help learners choose a next lesson\nMeasure: can a learner find it?\nEvidence: task success + feedback\nLimit: short pilot with a small group',output:'The evaluation connects the goal to evidence and interpretation.',steps:['Return to the problem statement.','Choose measures that reflect the intended outcome.','Observe users completing realistic tasks.','Report findings, limitations, and a next improvement.'],practice:'Plan one usability task and two success measures for the Academy dashboard.',checkQuestion:'What should an evaluation measure?',checkChoices:['The intended user outcome described in the project goal','Only the amount of code written','Whether the team enjoyed its framework'],checkAnswer:0,checkWhy:'Relevant measures show whether the project addressed the problem it set out to solve.'},
{id:'internship-reflection',moduleIndex:30,title:'Keep a useful industry learning log',time:'8 min',objective:'Record work evidence and reflect on a professional learning goal.',explain:'A learning log captures tasks, decisions, feedback, and questions while the details are fresh. It helps a student reflect on growth and prepare a clear update for a supervisor.',analogy:'A field notebook helps a researcher remember what happened and why it mattered.',code:'Task: fixed a validation bug\nDecision: reject empty input at the API boundary\nEvidence: added 3 tests\nNext: ask for review of error messages',output:'A short log connects work completed with evidence and a next goal.',steps:['Describe a task and your contribution.','Record one decision and its reason.','Save evidence such as tests or a review.','Choose one follow-up question or skill goal.'],practice:'Write a four-line learning log entry for a bug fix you contributed to.',checkQuestion:'What makes a learning log useful?',checkChoices:['Specific tasks, decisions, evidence, and reflection','A list of hours with no context','Only positive feedback'],checkAnswer:0,checkWhy:'Concrete evidence and reflection make progress easier to discuss and build on.'},
{id:'team-handoffs',moduleIndex:30,title:'Hand work across a team clearly',time:'8 min',objective:'Give a teammate enough context to continue your work.',explain:'A good handoff states what is done, what remains, what was tried, and what risks or questions need attention. Clear handoffs reduce duplicated work and make collaboration smoother.',analogy:'A relay handoff gives the next runner the baton and a clear view of the track ahead.',code:'Done: lesson search UI\nTried: keyboard and mobile checks\nOpen: empty state copy\nWatch: long lesson titles wrap',output:'The next teammate can continue without retracing every step.',steps:['Summarize the goal and current state.','Link to the relevant work or evidence.','List open questions and known risks.','Name the next action clearly.'],practice:'Write a short handoff for an unfinished API feature that has one failing test.',checkQuestion:'What should a handoff communicate?',checkChoices:['Current state, evidence, open questions, and a next step','Only that the work is unfinished','A new task with no context'],checkAnswer:0,checkWhy:'The recipient needs context and a clear next action to continue effectively.'},
{id:'business-value',moduleIndex:31,title:'Explain the value of a software idea',time:'9 min',objective:'Connect a product idea to an audience, need, and measurable benefit.',explain:'An idea becomes a useful product when it serves a real audience and improves something that audience cares about. A value proposition says who benefits, what problem is reduced, and why the solution is useful.',analogy:'A tool earns a place in a workshop by helping someone do an important job better.',code:'For: first-year students\nWho need: a clear practice routine\nThis tool: turns a course plan into daily actions\nSuccess: more learners finish a weekly plan',output:'The idea is expressed in terms of a real audience and outcome.',steps:['Name a specific user group.','Describe an important unmet need.','Explain the benefit in plain language.','Choose evidence that could show the benefit.'],practice:'Write a one-sentence value proposition for a campus tutoring coordination app.',checkQuestion:'What should a value proposition focus on?',checkChoices:['A user, a need, and a meaningful benefit','A list of programming languages','A claim that every person needs the product'],checkAnswer:0,checkWhy:'A clear value proposition connects the solution to a user benefit.'},
{id:'responsible-ai',moduleIndex:31,title:'Use AI tools with professional judgment',time:'9 min',objective:'Check AI-generated code for correctness, privacy, and licensing concerns.',explain:'AI tools can suggest code and explanations, but engineers remain responsible for what they ship. Verify behavior, protect private data, check dependencies and licenses, and disclose assistance when required by your course or workplace.',analogy:'A calculator can help with arithmetic, but you still check whether you entered the right numbers and used the result appropriately.',code:'Suggestion → inspect source and license\n→ run tests → check security → document use',output:'AI assistance is reviewed as part of ordinary engineering responsibility.',steps:['Keep confidential data out of unapproved tools.','Inspect generated code and dependencies.','Test security and correctness.','Follow the relevant disclosure and license rules.'],practice:'Create a four-item checklist for reviewing AI-generated code before including it in your capstone.',checkQuestion:'Who is responsible for AI-assisted code in a project?',checkChoices:['The engineer or team that chooses to use and ship it','The tool alone','The first person who reads it'],checkAnswer:0,checkWhy:'The team remains accountable for the code and its effects.'},
{id:'portfolio-case-study',moduleIndex:32,title:'Turn a project into a portfolio case study',time:'9 min',objective:'Show the problem, your contribution, evidence, and reflection in a project story.',explain:'A case study helps a reviewer understand how you approached a project. Explain the user problem, your role, a meaningful decision, the result, and what you would improve with more time.',analogy:'A good museum label gives visitors the story behind an object, not only its name.',code:'Problem → my role → key decision\n→ what I built and tested → result\n→ limitation and next step',output:'A reviewer can see both what you made and how you reasoned.',steps:['Choose a project that demonstrates a relevant skill.','Explain the intended user and problem.','Show your contribution and evidence.','Reflect honestly on a limitation and next step.'],practice:'Outline a case study for your capstone using the six parts in the example.',checkQuestion:'What makes a portfolio case study convincing?',checkChoices:['It connects the problem to decisions, evidence, and reflection','It only lists technologies','It hides unfinished parts'],checkAnswer:0,checkWhy:'The story lets a reviewer see the work and the thinking behind it.'},
{id:'specialization-roadmap',moduleIndex:32,title:'Plan a focused specialization project',time:'8 min',objective:'Turn an area of interest into a small portfolio-ready experiment.',explain:'A specialization project lets you explore an area such as security, mobile, data, or cloud engineering. Keep the scope small enough to finish, state what you want to learn, and save evidence of the result.',analogy:'Try a short route before planning a long expedition; the experience tells you whether the terrain fits.',code:'Interest: application security\nQuestion: can the form reject unsafe input?\nExperiment: validate and test 3 edge cases\nEvidence: test results + reflection',output:'A compact experiment produces both a learning result and portfolio evidence.',steps:['Choose a problem area that interests you.','Write one question you want to answer.','Build a small experiment with a clear boundary.','Save evidence and reflect on what to learn next.'],practice:'Design a small data, mobile, cloud, or security experiment that you could complete in a week.',checkQuestion:'What is a useful specialization project?',checkChoices:['A small experiment with a learning question and evidence','An unfinished copy of a large product','A tool list with no user problem'],checkAnswer:0,checkWhy:'A focused experiment can be completed, evaluated, and explained.'}
