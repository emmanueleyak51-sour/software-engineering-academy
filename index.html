lessons=lessons.concat(additionalLessons); lessons.sort((a,b)=>a.moduleIndex-b.moduleIndex);
lessons.forEach(l=>{l.moduleIndex??=2;if(l.checkChoices===undefined){const checks={intro:['What is JavaScript?',['A programming language','A computer screen','A database table'],0,'JavaScript is a programming language used to give instructions to a computer.'],variables:['What is a variable?',['A named place to store a value','A web page','A keyboard shortcut'],0,'A variable gives a value a name your program can use.'],types:['Which value is a boolean?',['"hello"','42','true'],2,'A boolean is either true or false.'],operators:['What does 4 * 3 produce?',['7','12','43'],1,'The * operator multiplies the two numbers.'],conditions:['When does an if block run?',['When its condition is true','Every time the page loads','Only after a delay'],0,'An if block runs when its condition is true.'],loops:['What is a loop useful for?',['Repeating instructions','Naming a database','Styling a button'],0,'A loop repeats a set of instructions.'],functions:['What is a function?',['A reusable set of instructions','A browser tab','A number type'],0,'A function groups instructions that can be called when needed.']};const c=checks[l.id]||['What is the main idea of this lesson?',['Use the concept for its intended purpose','Ignore the concept','Remove the need to understand the code'],0,'Use the concept for the job described in the lesson.'];l.checkQuestion=c[0];l.checkChoices=c[1];l.checkAnswer=c[2];l.checkWhy=c[3]}});
const initial={completed:[],xp:0,streak:0,bestStreak:0,quizAverage:0,quizRuns:0,exerciseDone:[],assignments:[],notes:[],lessonChecks:{},studyDays:{},projectSteps:[],assignmentSteps:[],profile:{name:"",email:""},sessionActive:false};
let state;try{const stored=JSON.parse(localStorage.getItem('academy-v1')||'{}');state={...initial,...stored};if(state.profile?.name==='Emmanuel')state.profile.name='';if(!stored.truthfulProgressV2){const checks=Object.values(state.lessonChecks||{}).filter(Boolean).length,projects=((state.projectStepRewards||state.projectSteps)||[]).reduce((n,steps)=>n+(steps||[]).filter(Boolean).length,0),exams=(state.examRuns||[]).reduce((n,x)=>n+(x.score>=75?40:20),0);state.xp=(state.completed||[]).length*50+checks*3+(state.exerciseDone||[]).length*10+Math.round((state.quizAverage||0)*(state.quizRuns||0)/4)+projects*5+exams+((state.dailyProgress?.bonus)?25:0);if(!(state.completed||[]).length&&!checks&&!((state.examRuns||[]).length)&&!state.quizRuns&&!projects){state.completed=[];state.lessonChecks={};state.exerciseDone=[];state.quizRuns=0;state.quizAverage=0;state.examRuns=[];state.projectSteps=[];state.projectStepRewards=[];state.xp=0;state.dailyProgress=null;state.studyDays={};state.streak=0;state.bestStreak=0;state.lastStudyDate=null}state.projectStepRewards ||= (state.projectSteps||[]).map(steps=>(steps||[]).map(Boolean));const previousAssignments=state.assignments||[],previousSteps=state.assignmentSteps||[],kept=previousAssignments.map((item,index)=>({item,index})).filter(({item})=>!['JavaScript Foundations worksheet','Pseudocode: daily study planner','Build a personal profile page'].includes(item.title));state.assignments=kept.map(x=>x.item);state.assignmentSteps=kept.map(x=>previousSteps[x.index]||[]);if(!state.lastStudyDate||!Object.keys(state.studyDays||{}).length){state.streak=0;state.bestStreak=0;state.lastStudyDate=null;state.studyDays={}}state.truthfulProgressV2=true;localStorage.setItem('academy-v1',JSON.stringify(state));}}catch{state={...initial,truthfulProgressV2:true}}document.querySelector('#xp').textContent=state.xp;document.querySelector('#streak').textContent=state.streak;let view='Dashboard',activeLesson='variables',quizIndex=0,quizScore=0,quizAnswered=false;
const questions=[{q:'What is a variable?',opts:['A named place that stores a value','A computer screen','A type of loop'],answer:0,why:'A variable gives a value a name so your program can use it.'},{q:'Which keyword is used when a value may be reassigned?',opts:['const','let','return'],answer:1,why:'let allows the variable to be given a new value later.'},{q:'What happens here? let age = 20; age = 25;',opts:['The program stops','age now stores 25','age stores both numbers'],answer:1,why:'A let variable can be reassigned, so age now contains 25.'},{q:'What does console.log() do?',opts:['Shows a value in the console','Creates a variable','Deletes a value'],answer:0,why:'console.log() displays information in the browser console or coding lab output.'},{q:'Which keyword is best when you will not reassign a variable?',opts:['let','if','const'],answer:2,why:'const communicates that the variable name will not be reassigned.'}];
function save(){localStorage.setItem('academy-v1',JSON.stringify(state));document.querySelector('#xp').textContent=state.xp;document.querySelector('#streak').textContent=state.streak;updateLearnerIdentity();if(document.querySelector('#xp-panel'))renderXpPanel()}
function awardXP(amount){amount=Math.max(0,Number(amount)||0);state.xp=(state.xp||0)+amount;const today=localDayKey();if(state.xpToday?.date!==today)state.xpToday={date:today,amount:0};state.xpToday.amount+=amount}
function toggleXpPanel(){const trigger=document.querySelector('#xp-trigger'),existing=document.querySelector('#xp-panel');if(existing){existing.remove();trigger?.setAttribute('aria-expanded','false');return}document.querySelector('.topbar')?.insertAdjacentHTML('beforeend','<section class="xp-panel" id="xp-panel" role="dialog" aria-label="Your XP and daily goal"></section>');trigger?.setAttribute('aria-expanded','true');renderXpPanel()}
function renderXpPanel(){const panel=document.querySelector('#xp-panel');if(!panel)return;const xp=state.xp||0,level=Math.floor(xp/100)+1,within=xp%100,today=state.xpToday?.date===localDayKey()?state.xpToday.amount:0,goal=50;panel.innerHTML=`<div class="xp-panel-head"><span class="xp-panel-bolt">ϟ</span><div><small>YOUR ENGINEER LEVEL</small><h2>Level ${level}</h2></div><span class="xp-level-badge">${level}</span></div><div class="xp-meter"><span style="width:${within}%"></span></div><div class="xp-meter-meta"><b>${xp} XP total</b><span>${100-within} to level ${level+1}</span></div><div class="xp-goal-title">Today's goal <span>${Math.min(today,goal)} / ${goal} XP</span></div><div class="xp-meter goal"><span style="width:${Math.min(100,today/goal*100)}%"></span></div><div class="xp-meter-meta"><span>${Math.min(today,goal)} of ${goal} XP earned today</span><b>${today>=goal?'Goal reached ✨':'Keep going'}</b></div><div class="xp-panel-foot"><span class="xp-live-dot"></span>${today>=goal?'You showed up for your growth today.':'Every lesson, challenge, and check adds real XP.'}</div>`}
document.addEventListener('click',e=>{if(document.querySelector('#xp-panel')&&!e.target.closest('#xp-panel')&&!e.target.closest('#xp-trigger')){document.querySelector('#xp-panel').remove();document.querySelector('#xp-trigger')?.setAttribute('aria-expanded','false')}});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localGreeting(){const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}function pct(){return Math.round(state.completed.length/lessons.length*100)}function progressBar(p){return `<div class="progress-line"><span style="width:${p}%"></span></div>`}
function setView(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.querySelector('#crumb').textContent='Workspace / '+v;render()}
function goLesson(id){activeLesson=id;setView('Learn')}
function initNav(){document.querySelector('#nav').innerHTML=navItems.map(([n,i])=>`<button data-view="${n}" onclick="setView('${n}')" class="${view===n?'active':''}" aria-label="${n}"><span class="icon">${i}</span><span>${n}</span></button>`).join('')}
function dashboard(){const done=state.completed.length;return `<section class="page"><div class="hero"><div class="hero-grid"></div><div class="hero-symbol">{ } &lt;/&gt;</div><div class="hero-content"><div class="eyebrow">${new Intl.DateTimeFormat("en",{weekday:"long",month:"short",day:"numeric"}).format(new Date()).toUpperCase()} · YOUR LEARNING SPACE</div><h1>${localGreeting()}, ${esc(learnerName())} <span style="font-size:.8em">👋</span></h1><p>Let's make Software Engineering simple. Small steps today, real skills for your future.</p><button class="btn primary" onclick="goLesson('${done?lessons.find(l=>!state.completed.includes(l.id))?.id||'variables':'variables'}')">Continue learning <span aria-hidden="true">→</span></button></div></div><div class="grid stats"><div class="stat"><div class="stat-head">Guided lesson progress <span class="stat-icon">◌</span></div><div class="stat-num" data-count="${pct()}">${pct()}%</div><div class="stat-note">Across the four-year course</div></div><div class="stat"><div class="stat-head">Lessons completed <span class="stat-icon">✓</span></div><div class="stat-num" data-count="${done}">${done}<span style="font-size:14px;color:var(--muted)"> / ${lessons.length}</span></div><div class="stat-note">One idea at a time</div></div><div class="stat"><div class="stat-head">Learning streak <span class="stat-icon">♨</span></div><div class="stat-num">${state.streak} days</div><div class="stat-note">Your rhythm is building</div></div><div class="stat"><div class="stat-head">Quiz average <span class="stat-icon">◎</span></div><div class="stat-num">${state.quizRuns?state.quizAverage+'%':'—'}</div><div class="stat-note">${state.quizRuns?'Across '+state.quizRuns+' attempts':'Try your first knowledge check'}</div></div></div><div class="grid cols"><div class="grid"><div><h2 class="section-title">Continue learning</h2><div class="card continue"><div class="course-icon">JS</div><div class="info"><div class="eyebrow">JAVASCRIPT FUNDAMENTALS</div><h3>${esc(lessons.find(l=>!state.completed.includes(l.id))?.title||'Course complete!')}</h3><p>${done?'Next up · ':'Your first lesson · '}A beginner-friendly ${done?'next step':'introduction'} · ${lessons.find(l=>!state.completed.includes(l.id))?.time||'Great work'}</p>${progressBar(pct())}<div class="progress-meta"><span>${pct()}% complete</span><span>${done} of ${lessons.length} guided lessons</span></div></div><button class="btn primary" onclick="goLesson('${lessons.find(l=>!state.completed.includes(l.id))?.id||'variables'}')">Open lesson →</button></div></div><div class="card"><div class="row card-head"><h2 class="section-title" style="margin:0">Today's plan</h2><button class="btn ghost small" onclick="setView('Learn')">View course</button></div><div class="tasks"><div class="task"><span class="task-icon">▤</span><div><b>${state.completed.includes('variables')?'Review Data Types':'Learn · JavaScript Variables'}</b><small>Understand the idea · 8 min</small></div></div><div class="task"><span class="task-icon">⌘</span><div><b>Practice · Create your first variables</b><small>Try a small coding challenge · 5 min</small></div></div><div class="task"><span class="task-icon">◷</span><div><b>Check in · Beginner quiz</b><small>Build confidence with a quick review · 3 min</small></div></div></div></div></div><div class="grid"><div class="card"><div class="row card-head"><h2 class="section-title" style="margin:0">Let's strengthen</h2><span class="tag warn">Recommended</span></div><div class="weak-list"><div class="weak"><span>Functions</span><span class="tag">Not started</span></div><div class="weak"><span>Data Types</span><span class="tag">Up next</span></div><div class="weak"><span>Variables</span><span class="tag ${state.completed.includes('variables')?'':'warn'}">${state.completed.includes('variables')?'Strong':'In progress'}</span></div></div><div style="margin-top:17px"><button class="btn small" onclick="goLesson('variables')">Review a topic →</button></div></div><div class ss="card"><h2 class="section-title">Practice activity</h2><div class="chart">${bars.map((d,i)=>`<div class="bar-wrap" title="${d.key}: ${d.active?'activity recorded':'no activity'}"><div class="bar ${d.active?'bar-active':'bar-empty'}" style="height:${d.active?100:7}%;animation-delay:${i*.06}s"></div><small>${d.label}</small></div>`).join('')}</div><p class="sub" style="font-size:11px">${bars.some(d=>d.active)?'Study days recorded during the last seven days.':'Your study history will appear here after your first lesson.'}</p></div><div class="card"><h2 class="section-title">Learning map</h2><div class="tasks">${lessons.map((l,i)=>`<div class="task"><span class="task-icon" style="${state.completed.includes(l.id)?'background:#23483e;color:var(--mint)':''}">${state.completed.includes(l.id)?'✓':i+1}</span><div><b>${esc(l.title)}</b><small>${state.completed.includes(l.id)?'Completed':i===state.completed.length?'Ready to learn':'Up next'}</small></div>${i<lessons.length-1?'<span style="color:#4e5b69">↓</span>':''}</div>`).join('')}</div></div><div class="card"><h2 class="section-title">A useful next step</h2><p class="sub" style="font-size:12px">${state.completed.includes('variables')?'Try Data Types next, then practise identifying text, numbers, and true/false values.':'Start with Variables, then try a tiny coding challenge to use what you learned.'}</p><button class="btn small" style="margin-top:12px" onclick="goLesson('${state.completed.includes('variables')?'types':'variables'}')">Go to lesson →</button></div></div></section>`}

er-radius:10px;background:#0e141c;color:var(--text);margin:6px 0 10px"><label class="eyebrow" for="new-assignment-subject">COURSE (OPTIONAL)</label><input id="new-assignment-subject" placeholder="Course name" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0e141c;color:var(--text);margin:6px 0 10px"><label class="eyebrow" for="new-assignment-due">DUE DATE (OPTIONAL)</label><input id="new-assignment-due" type="date" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0e141c;color:var(--text);margin:6px 0 12px"><button class="btn primary" onclick="addAssignment()">Add to my list</button></div><div class="card"><div class="eyebrow">LEARNING ASSISTANT</div><h2 class="section-title" style="margin-top:8px">Need a starting point?</h2><p class="sub" style="font-size:12px">Start by explaining the task in your own words. Then identify what you already know and what you want to learn.</p><button class="btn" style="margin-top:14px" onclick="toast('Write one sentence describing what the assignment asks you to build. That is your first step.')">Help me break it down</button></div></div></section>`}

function projects(){return `<section class="page"><div class="eyebrow">BUILD YOUR SKILLS</div><h1 class="h1">Projects</h1><p class="sub" style="margin-bottom:21px">Projects turn new ideas into things you can show and use. Track each milestone as you build.</p><div class="grid module-grid">${projectCatalog.map((p,i)=>{const done=state.projectSteps[i]||[];return `<div class="card module-card"><div class="row"><span class="eyebrow">PROJECT ${String(i+1).padStart(2,'0')}</span><span class="tag">${i===0?'Start here':i===1?'Next project':'Learning path'}</span></div><h3>${esc(p[0])}</h3><p>${['Practise HTML structure and introduce yourself online.','Use variables, operators, and button interactions.','Organize tasks and update a page with JavaScript.','Combine conditions and functions to calculate results.','Store, find, and update student records.','Bring your skills together in a larger application.'][i]}</p><div style="margin:12px 0">${progressBar(Math.round(done.filter(Boolean).length/p[1].length*100))}<div class="progress-meta"><span>${done.filter(Boolean).length}/${p[1].length} milestones</span><span>${Math.round(done.filter(Boolean).length/p[1].length*100)}%</span></div></div><button class="btn small" onclick="toggleProject(${i})">${expandedProject===i?'Hide milestones':'View milestones'}</button>${expandedProject===i?`<div style="margin-top:10px">${p[1].map((s,j)=>`<label class="task" style="cursor:pointer"><input type="checkbox" ${done[j]?'checked':''} onchange="toggleProjectStep(${i},${j},this.checked)"><span><b>${esc(s)}</b><small>${done[j]?'Milestone complete':'Mark complete when ready'}</small></span></label>`).join('')}</div>`:''}</div>`}).join('')}</div></section>`}

let examYear=1,examQuestions=[];
function questionsForYear(year){const pool=lessons.filter(l=>curriculum.find(m=>m.index===l.moduleIndex)?.year===Number(year)).map(l=>({q:l.checkQuestion,options:l.checkChoices,answer:l.checkAnswer,topic:l.title,why:l.checkWhy}));const count=Math.min(10,pool.length);return Array.from({length:count},(_,i)=>pool[Math.floor(i*pool.length/count)])}

function exams(){if(examRun&&examRun.index<examQuestions.length){const i=examRun.index,q=examQuestions[i],chosen=examRun.answers[i];return `<section class="page"><div class="eyebrow">MOCK EXAM · QUESTION ${i+1} OF ${examQuestions.length}</div><h1 class="h1">Year ${examYear} mock exam</h1><p class="sub" style="margin-bottom:20px">Questions draw from your Year ${examYear} lesson checks. Untimed · Explanations and targeted revision follow.</p><div class="card" style="max-width:760px"><div class="progress-meta"><span>${q.topic}</span><span>${Math.round((i/examQuestions.length)*100)}% complete</span></div><div style="margin:9px 0 22px">${progressBar(Math.round((i/examQuestions.length)*100))}</div><h2 style="font-size:20px">${esc(q.q)}</h2>${q.options.map((o,n)=>`<button class="quiz-option ${chosen===n?'selected':''}" onclick="selectExamAnswer(${n})"><span class="choice">${String.fromCharCode(65+n)}</span>${esc(o)}</button>`).join('')}<div class="row" style="margin-top:18px"><button class="btn ghost" onclick="examRun=null;render()">Save and exit</button><button class="btn primary" ${chosen===undefined?'disabled':''} onclick="nextExamQuestion()">${i===examQuestions.length-1?'Finish mock exam':'Next question →'}</button></div></div></section>`}if(examRun&&examRun.index>=examQuestions.length){const misses=examQuestions.filter((q,i)=>examRun.answers[i]!==q.answer),score=Math.round((examQuestions.length-misses.length)/examQuestions.length*100),weak=[...new Set(misses.map(q=>q.topic))];return `<section class="page"><div class="card" style="max-width:850px;margin:12px auto;padding:28px"><div class="eyebrow">YEAR ${examYear} MOCK EXAM · RESULTS</div><div class="readiness" style="margin:15px 0"><div class="ring"><strong>${score}%</strong></div><div><h1 class="h1" style="font-size:26px">${score>=75?'Strong progress.':'A useful practice round.'}</h1><p class="sub">You answered ${examQuestions.length-misses.length} of ${examQuestions.length} correctly. This is a learning snapshot, not a prediction of exam results.</p></div></div><div class="grid cols"><div class="concept"><strong>Strong areas</strong><p>${[...new Set(examQuestions.filter((q,i)=>examRun.answers[i]===q.answer).map(q=>q.topic))].map(esc).join(' · ')||'Keep practising each topic'}</p></div><div class="concept"><strong>Topics to review</strong><p>${weak.map(esc).join(' · ')||'No missed topics this time — excellent work.'}</p></div></div>${misses.length?`<h2 class="section-title" style="margin-top:22px">Let's review the missed questions</h2>${misses.map(q=>`<div class="task"><span class="task-icon">↗</span><div><b>${esc(q.topic)}</b><small>${esc(q.why)}</small></div></div>`).join('')}`:''}<div class="row" style="margin-top:22px"><button class="btn" onclick="examRun=null;setView('Progress')">View progress</button><button class="btn primary" onclick="examRun=null;startMockExam()">Try another mock exam</button></div></div></section>`}return `<section class="page"><div class="eyebrow">PREPARE WITH CONFIDENCE</div><h1 class="h1">Exam practice</h1><p class="sub" style="margin-bottom:21px">Practise without pressure. Use results to choose what to review next.</p><div class="grid cols"><div class="card"><div class="eyebrow">FOUR-YEAR ASSESSMENT</div><h2 style="font-size:20px;margin:8px 0">Year ${examYear} mock exam</h2><label class="eyebrow" for="exam-year">CHOOSE ACADEMIC YEAR</label><select id="exam-year" class="pill" style="display:block;margin:7px 0 12px" onchange="selectExamYear(this.value)">${[1,2,3,4].map(y=>`<option value="${y}" ${examYear===y?'selected':''}>Year ${y} · ${['Foundations','Core engineering','Advanced practice','Professional launch'][y-1]}</option>`).join('')}</select><p class="sub" style="font-size:12px">${questionsForYear(examYear).length} questions from guided lessons · Untimed · Explanations and review topics</p><div class="concept" style="margin:16px 0"><strong>Topics sampled</strong><p>${[...new Set(questionsForYear(examYear).map(q=>q.topic))].slice(0,5).map(esc).join(' · ')}</p></div><button class="btn primary" onclick="startMockExam()">Start Year ${examYear} mock exam →</button><button class="btn" style="margin-left:8px" onclick="quizIndex=0;quizScore=0;quizAnswered=false;renderQuizOnly()">Quick 5-question quiz</button></div><div class="card"><div class="eyebrow">YOUR READINESS</div><h2 class="section-title" style="margin-top:8px">Learning progress indicator</h2><div class="readiness"><div class="ring" style="background:conic-gradient(var(--mint) 0 ${state.quizRuns?state.quizAverage:0}%,#2b3542 ${state.quizRuns?state.quizAverage:0}% 100%)"><strong>${state.quizRuns?state.quizAverage+'%':'—'}</strong></div><p class="sub" style="font-size:12px">An educational progress indicator, not a prediction of exam results. Keep learning and practising to strengthen it.</p></div></div></div></section>`}

function animateLoginStats(){const counters=[...document.querySelectorAll('.login-count')],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;counters.forEach((el,index)=>{const target=Number(el.dataset.count)||0;if(reduced){el.textContent=target.toLocaleString();return}const start=performance.now()+index*150,duration=1050;function tick(now){if(now<start){requestAnimationFrame(tick);return}const t=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-t,4);el.textContent=Math.round(target*eased).toLocaleString();if(t<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)})}
function signInLocal(){const name=document.querySelector('#login-name')?.value.trim(),email=document.querySelector('#login-email')?.value.trim()||'';if(!name){toast('Enter your name to continue.');return}state.profile={name,email};state.sessionActive=true;save();render()}
function signOutLocal(){state.sessionActive=false;save();render()}
function render(){document.body.classList.toggle('login-mode',!state.sessionActive);if(!state.sessionActive){document.querySelector('#nav').innerHTML='';document.querySelector('#crumb').textContent='Academy / Sign in';document.querySelector('#content').innerHTML=loginPage();animateLoginStats();return}updateLearnerIdentity();renderCommon();lessonProgressRender();revealMotion()}
